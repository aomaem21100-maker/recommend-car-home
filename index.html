<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เว็บรวมผลงาน | Recommend_car</title>
<meta name="description" content="เว็บรวมผลงานที่ส่งอาจารย์ โปรเจกต์ Recommend_car ระบบแนะนำรถยนต์ด้วย Graph Database (Neo4j)">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#22272e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #22272e;
    --card: #2d333b;
    --card-hover: #323a44;
    --border: #444c56;
    --text: #adbac7;
    --strong: #cdd9e5;
    --muted: #8b98a5;
    --link: #539bf5;
    --green: #347d39;
    --green-hover: #46954a;
    --btn2: #373e47;
    --btn2-hover: #444c56;
}

*, *::before, *::after { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Thai', 'Sarabun', Tahoma, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
    border-radius: 6px;
}

.page {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr);
    gap: 32px;
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 20px 64px;
    align-items: start;
}

/* ---------- Sidebar ---------- */
.side { position: sticky; top: 32px; }
.side h1 {
    margin: 0;
    font-size: 1.55rem;
    line-height: 1.35;
    font-weight: 700;
    color: var(--strong);
}
.side .sid {
    margin: 2px 0 14px;
    font-size: 1.05rem;
    color: var(--muted);
}
.side .bio { margin: 0 0 16px; color: var(--strong); font-size: .92rem; }
.side hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }

.info { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.info li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.info .ic {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    margin-top: 3px;
    border-radius: 5px;
    font-size: .8rem;
    background: #373e47;
}
.info .k { display: block; font-size: .76rem; color: var(--muted); line-height: 1.3; }
.info .v { display: block; color: var(--strong); font-size: .95rem; line-height: 1.4; }

/* ---------- Buttons ---------- */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 5px 14px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px;
    background: var(--green);
    color: #ffffff;
    font-family: inherit;
    font-weight: 500;
    font-size: .84rem;
    line-height: 1.5;
    white-space: nowrap;
    cursor: pointer;
}
.btn:hover { background: var(--green-hover); text-decoration: none; }
.btn.secondary { background: var(--btn2); border-color: var(--border); color: var(--strong); }
.btn.secondary:hover { background: var(--btn2-hover); }
.btn.block { display: flex; width: 100%; padding: 7px 14px; font-size: .9rem; }

/* ---------- Main ---------- */
.main-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}
.main-head h2 { margin: 0; font-size: 1.15rem; font-weight: 600; color: var(--strong); }
.count {
    min-width: 22px;
    padding: 0 8px;
    border-radius: 999px;
    background: #373e47;
    color: var(--text);
    font-size: .78rem;
    text-align: center;
    line-height: 1.7;
}

.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.card {
    flex: 1 1 calc(50% - 8px);
    max-width: calc(50% - 8px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
}
.card.wide { flex-basis: 100%; max-width: 100%; }
.card:hover { background: var(--card-hover); }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card .title { margin: 0; font-size: 1rem; font-weight: 600; line-height: 1.5; }
.card .title a { color: var(--link); }
.pill {
    flex: none;
    padding: 0 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: .72rem;
    color: var(--text);
    line-height: 1.7;
}
.card .desc { margin: 0; font-size: .84rem; color: var(--text); }

.card-foot {
    margin-top: auto;
    padding-top: 6px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; }
.chips li { display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
.chips i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }

.empty { color: var(--muted); text-align: center; padding: 40px 0; }

/* ---------- Responsive ---------- */
@media (max-width: 820px) {
    .page { grid-template-columns: 1fr; gap: 24px; padding-top: 32px; }
    .side { position: static; }
    .info { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card, .card.wide { flex-basis: 100%; max-width: 100%; }
}
@media (max-width: 420px) {
    .info { grid-template-columns: 1fr; }
    .actions { margin-left: 0; }
}
</style>
</head>
<body>

<div class="page">
    <aside class="side" aria-label="โปรไฟล์">
        <h1 id="p-name"></h1>
        <p class="sid" id="p-id"></p>
        <p class="bio" id="p-bio"></p>
        <div id="p-gh"></div>
        <hr>
        <ul class="info" id="p-info"></ul>
    </aside>

    <main>
        <div class="main-head">
            <h2>📚 ผลงานของฉัน</h2>
            <span class="count" id="count"></span>
        </div>
        <div class="cards" id="cards"></div>
        <noscript><p class="empty">ต้องเปิด JavaScript เพื่อแสดงรายการผลงาน</p></noscript>
    </main>
</div>

<script>
/* ======================================================================
   แก้ข้อมูลของหน้านี้ที่นี่ที่เดียว (โปรไฟล์ + รายการผลงาน)
   - ปุ่มที่ url ว่าง ("") จะไม่แสดง
   - เพิ่มงานใหม่: คัดลอกก้อน { ... } ใน WORKS ไปต่อท้ายแล้วแก้
   - wide: true = การ์ดเต็มความกว้าง (ใช้กับงาน Final)
   ====================================================================== */
const PROFILE = {
    name: "จตุรภัทร สถาปิตานนท์",
    studentId: "664245024",
    bio: "เว็บรวมผลงานที่ส่งอาจารย์ โปรเจกต์ Recommend_car",
    github: "https://github.com/aomaem21100-maker",
    info: [
        { icon: "🆔", label: "รหัสนักศึกษา", value: "664245024" },
        { icon: "👥", label: "หมู่เรียน", value: "66/43" },
        { icon: "🏫", label: "คณะ", value: "วิทยาศาสตร์และเทคโนโลยี" },
        { icon: "💻", label: "สาขา", value: "วิทยาการคอมพิวเตอร์" }
    ]
};

const COLORS = {
    notebook: "#f37626",
    canva: "#7d2ae8",
    python: "#3572a5",
    streamlit: "#ff4b4b",
    neo4j: "#4581c3"
};

const WORKS = [
    {
        icon: "📘",
        title: "งานที่ 1 - โครงสร้างข้อมูลรถยนต์",
        badge: "Notebook",
        desc: "จัดการและวิเคราะห์ข้อมูลรถยนต์สำหรับระบบแนะนำ เปิดและรันได้บน Google Colab",
        chips: [{ label: "Jupyter Notebook", color: COLORS.notebook }],
        buttons: [
            { label: "เปิดใน Colab", url: "https://colab.research.google.com/drive/1TSqD6dk7fj__txvG_xBwG3HH9vDFcz5K?usp=sharing" }
        ]
    },
    {
        icon: "📘",
        title: "งานที่ 2 - วิเคราะห์ข้อมูลรถยนต์",
        badge: "Notebook",
        desc: "วิเคราะห์คุณสมบัติและความสัมพันธ์ของข้อมูลรถยนต์ เปิดและรันได้บน Google Colab",
        chips: [{ label: "Jupyter Notebook", color: COLORS.notebook }],
        buttons: [
            { label: "เปิดใน Colab", url: "https://colab.research.google.com/drive/1tbFJ48SuP3vwyOX_ZFAfnXY3_4s_7JHW?usp=drive_link" }
        ]
    },
    {
        icon: "📝",
        title: "งานที่ 3 - แบบฝึกหัด",
        badge: "Canva",
        desc: "แบบฝึกหัดประกอบการนำเสนอโปรเจกต์ Recommend_car",
        chips: [{ label: "Canva", color: COLORS.canva }],
        buttons: [
            { label: "เปิดใน Canva", url: "https://canva.link/6sdssxnz2wcjzi4" }
        ]
    },
    {
        icon: "🎯",
        title: "งาน Final - ระบบแนะนำรถยนต์",
        badge: "Final",
        wide: true,
        desc: "เว็บแอปแนะนำรถยนต์ด้วย Graph Database (Neo4j) แนะนำรถจากเครือข่ายเพื่อนและรถที่คนรอบตัวขับ เปิดใช้งานผ่านหน้าเว็บ Streamlit พร้อมสไลด์นำเสนอบน Canva",
        chips: [
            { label: "Python", color: COLORS.python },
            { label: "Streamlit", color: COLORS.streamlit },
            { label: "Neo4j", color: COLORS.neo4j }
        ],
        buttons: [
            { label: "เปิดเว็บ Streamlit", url: "https://recommed-bfjta8sisqgrpbc7fbcfkx.streamlit.app/" },
            { label: "เปิดสไลด์นำเสนอ", url: "https://canva.link/713sawc3mr83jej", secondary: true }
            /* ถ้ามีลิงก์โค้ดบน GitHub ให้เพิ่มบรรทัดนี้:
               , { label: "ดูโค้ด", url: "https://github.com/...", secondary: true } */
        ]
    }
];

/* ---------------------------- แสดงผล ---------------------------- */
(function () {
    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }
    function link(label, url, cls) {
        var a = el('a', cls, label);
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        return a;
    }

    document.getElementById('p-name').textContent = PROFILE.name;
    document.getElementById('p-id').textContent = PROFILE.studentId;
    document.getElementById('p-bio').textContent = PROFILE.bio;
    if (PROFILE.github) {
        document.getElementById('p-gh').appendChild(link('ดูโปรไฟล์ GitHub', PROFILE.github, 'btn block'));
    }
    var info = document.getElementById('p-info');
    PROFILE.info.forEach(function (it) {
        var li = el('li');
        var ic = el('span', 'ic', it.icon);
        ic.setAttribute('aria-hidden', 'true');
        var box = el('div');
        box.appendChild(el('span', 'k', it.label));
        box.appendChild(el('span', 'v', it.value));
        li.appendChild(ic);
        li.appendChild(box);
        info.appendChild(li);
    });

    var wrap = document.getElementById('cards');
    document.getElementById('count').textContent = WORKS.length;

    WORKS.forEach(function (w) {
        var buttons = (w.buttons || []).filter(function (b) { return b.url; });
        var card = el('article', 'card' + (w.wide ? ' wide' : ''));

        var top = el('div', 'card-top');
        var h = el('h3', 'title');
        var label = w.icon + ' ' + w.title;
        if (buttons.length) h.appendChild(link(label, buttons[0].url));
        else h.textContent = label;
        top.appendChild(h);
        if (w.badge) top.appendChild(el('span', 'pill', w.badge));
        card.appendChild(top);

        card.appendChild(el('p', 'desc', w.desc));

        var foot = el('div', 'card-foot');
        var chips = el('ul', 'chips');
        (w.chips || []).forEach(function (c) {
            var li = el('li');
            var dot = el('i');
            dot.style.background = c.color;
            dot.setAttribute('aria-hidden', 'true');
            li.appendChild(dot);
            li.appendChild(document.createTextNode(c.label));
            chips.appendChild(li);
        });
        foot.appendChild(chips);

        var actions = el('div', 'actions');
        buttons.forEach(function (b) {
            actions.appendChild(link(b.label, b.url, 'btn' + (b.secondary ? ' secondary' : '')));
        });
        foot.appendChild(actions);
        card.appendChild(foot);

        wrap.appendChild(card);
    });
})();
</script>
</body>
</html>
